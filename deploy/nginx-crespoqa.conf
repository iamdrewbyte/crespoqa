# Replace qa.example.internal and the certificate paths. Terminates HTTPS and proxies to the local app.
server {
    listen 80;
    server_name qa.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name qa.example.internal;

    ssl_certificate     /etc/ssl/certs/crespoqa.crt;
    ssl_certificate_key /etc/ssl/private/crespoqa.key;

    client_max_body_size 110m;          # two reports; keep above 2 x CRESPOQA_MAX_FILE_MB
    proxy_read_timeout   3600s;         # SSE progress stream stays open
    proxy_buffering      off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
